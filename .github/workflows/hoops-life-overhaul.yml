name: Hoops Life game regression checks

on:
  push:
    branches: [hoops-overhaul-2026-10]
    paths:
      - 'hoops-life/**'
      - '.github/workflows/hoops-life-overhaul.yml'
  pull_request:
    paths:
      - 'hoops-life/**'
      - '.github/workflows/hoops-life-overhaul.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    name: Simulation and UI integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hoops-life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check js/modes/challenge820.js
          node --check js/modes/skilldraft.js
          node --check js/core/fx.js
          node --check js/media/fanfeed.js
          node --check js/media/skill-press.js
          node --check js/core/dna-fx.js
          node --check js/league/film-iq.js
          node --check js/league/fusion-lab.js
          node --check js/league/ability-replay.js
          node --check js/modes/game-night.js
          node --check js/core/fusion-ui.js
      - name: Test draft modes, generated leagues, longevity, gameplay and presentation
        run: |
          node --test \
            tools/test-overhaul-batch1.js \
            tools/test-fanfeed.js \
            tools/test-skill-press.js \
            tools/test-presentation-batch3.js \
            tools/test-film-iq.js \
            tools/test-genesis-820.js \
            tools/test-genesis-game-night.js \
            tools/test-draft-first.js \
            tools/test-power-network.js \
            tools/test-overhaul-batch2.js \
            tools/test-skilldraft-freechoice.js \
            tools/test-skilldraft-future.js \
            tools/test-dna-longevity.js \
            tools/test-rare-and-overhaul.js
